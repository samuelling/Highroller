<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0612">
<title>Highroller — the coloring sheet wakes up</title>
<style>
  :root { --paper:#f4ddd8; --red:#d9362b; --ink:#0b0612; --sea:#2f6fd0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--ink); color:var(--paper); overflow:hidden;
    font-family: "Rockwell", "Roboto Slab", "Courier New", ui-serif, serif; touch-action:none; }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  #stage { position:relative; flex:0 0 auto; }
  canvas { display:block; width:100%; height:100%; border-radius:6px; }
  #labels { position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .35s; }
  #labels.on { opacity:1; }
  #labels span { position:absolute; transform:translate(-50%,-50%); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    background:var(--ink); color:var(--paper); padding:3px 7px; border-radius:99px; white-space:nowrap; border:1px solid rgba(244,221,216,.5); }
  #bar { flex:0 0 auto; width:100%; max-width:560px; display:flex; align-items:center; gap:10px; padding:10px 14px 8px; }
  #bar label { font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.8; }
  #trip { flex:1; appearance:none; -webkit-appearance:none; height:8px; border-radius:99px; outline:none;
    background:linear-gradient(90deg,#f4ddd8,#ffd23f,#ff5db1,#7a5cff,#21d4fd,#3dff9a); }
  #trip::-webkit-slider-thumb { -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:var(--red);
    border:3px solid var(--paper); box-shadow:0 0 0 2px var(--ink); }
  #trip::-moz-range-thumb { width:22px; height:22px; border-radius:50%; background:var(--red); border:3px solid var(--paper); }
  button { font:inherit; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--paper); background:transparent;
    border:1.5px solid rgba(244,221,216,.55); border-radius:99px; padding:8px 11px; cursor:pointer; }
  button[aria-pressed="true"] { background:var(--paper); color:var(--ink); border-color:var(--paper); }
  #hint { position:absolute; left:50%; bottom:10px; transform:translateX(-50%); font-size:12px; letter-spacing:.1em; text-transform:uppercase;
    background:rgba(11,6,18,.8); padding:6px 12px; border-radius:99px; pointer-events:none; transition:opacity .8s; white-space:nowrap; }
  #load { position:absolute; inset:0; display:grid; place-items:center; font-size:13px; letter-spacing:.2em; text-transform:uppercase; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c" aria-label="Animated coloring sheet: a lobster in a beach chair, a surfing skeleton, a plane, a gull and a lighthouse"></canvas>
    <div id="labels"></div>
    <div id="hint">Tap the creatures</div>
    <div id="load">Waking it up…</div>
  </div>
  <div id="bar">
    <label for="trip">Trip</label>
    <input id="trip" type="range" min="0" max="100" value="70" aria-label="Trip intensity">
    <button id="bSeg" aria-pressed="false">Parts</button>
    <button id="bKal" aria-pressed="false">Kaleido</button>
    <button id="bSnd" aria-pressed="false">Sound</button>
  </div>
</div>

<script>
"use strict";
const W = 1449, H = 1932;
const SPR = [{"id":"bird0","x":1155.0,"y":103.5,"w":69,"h":22},{"id":"bird1","x":1095.0,"y":138.8,"w":103,"h":29},{"id":"bird2","x":1023.0,"y":180.8,"w":131,"h":44},{"id":"plane","x":484.5,"y":0.0,"w":343,"h":287},{"id":"prop","x":770.2,"y":99.8,"w":105,"h":165},{"id":"L_H1","x":44.2,"y":136.5,"w":155,"h":296},{"id":"L_I","x":159.8,"y":287.2,"w":113,"h":204},{"id":"L_G","x":240.8,"y":356.2,"w":108,"h":181},{"id":"L_H2","x":316.5,"y":394.5,"w":175,"h":228},{"id":"L_R1","x":462.0,"y":445.5,"w":526,"h":335},{"id":"L_O","x":630.8,"y":481.5,"w":128,"h":167},{"id":"L_L1","x":755.2,"y":497.2,"w":130,"h":176},{"id":"L_L2","x":886.5,"y":517.5,"w":125,"h":180},{"id":"L_E","x":988.5,"y":543.8,"w":208,"h":282},{"id":"L_R2","x":1134.8,"y":612.8,"w":227,"h":297},{"id":"gull","x":12.8,"y":696.0,"w":528,"h":325},{"id":"lobster","x":81.0,"y":1019.2,"w":558,"h":582},{"id":"splash","x":395.2,"y":1101.0,"w":206,"h":160},{"id":"cooler","x":81.0,"y":1565.2,"w":329,"h":333},{"id":"surfer","x":694.5,"y":847.5,"w":740,"h":898}];

/* ---------- per-object choreography ----------
   Each returns {ox,oy,rot,sx,sy,warp:[ampX,ampY,freq,phase],flap:[amp,centre]} at time t.
   m = motion amount (0..1), e = "kick" energy from a tap (1 → 0).                    */
const ease = x => 1 - Math.pow(1 - x, 3);
const spin = e => e > 0 ? ease(1 - e) * Math.PI * 2 : 0;
const letterIdx = {}; SPR.filter(s => s.id.startsWith("L_")).forEach((s, i) => letterIdx[s.id] = i);
const CHOREO = {
  plane:  { pivot:[.45,.5], aura:[5,.085], f:(t,m,e)=>({ ox:Math.sin(t*.7)*46*m, oy:(-12+Math.sin(t*1.4)*14)*m, rot:Math.cos(t*.7)*.1*m + spin(e), s:1+.1*Math.sin(Math.PI*e) }) },
  prop:   { pivot:[.5,.5], parent:"plane", aura:[0,0], f:(t,m)=>({ rot:t*17*m }) },
  gull:   { pivot:[.5,.6], aura:[5,.06], f:(t,m,e)=>({ ox:Math.sin(t*.9)*8*m, oy:(Math.sin(t*1.8)*9 - 40*Math.sin(Math.PI*e))*m, rot:Math.sin(t*.9+1)*.035*m,
              flap:[(.11*Math.sin(t*(5+9*e)))*m, .52] }) },
  lobster:{ pivot:[.45,.75], aura:[5,.05], f:(t,m,e)=>({ rot:Math.sin(t*1.1)*.03*m + Math.sin(t*14)*.06*e, s:1+(.022*Math.sin(t*2.1)+.12*Math.sin(Math.PI*e))*m,
              oy:-36*Math.sin(Math.PI*e)*m, warp:[(3+10*e)*m, (2+6*e)*m, 1.5, t*3] }) },
  splash: { pivot:[.5,1], aura:[4,.09], f:(t,m,e)=>({ sx:1+(.07*Math.sin(t*7)+.3*e)*m, sy:1+(.16*Math.sin(t*5+1)+.9*Math.sin(Math.PI*e))*m, warp:[3*m,0,2,t*6] }) },
  cooler: { pivot:[.5,1], aura:[4,.055], f:(t,m,e)=>{ const h=Math.pow(Math.max(0,Math.sin(t*1.5)),8)*26*m + 70*Math.sin(Math.PI*e)*m;
              return { oy:-h, rot:Math.sin(t*13)*.0012*h + spin(e), sy:1+.0016*h, sx:1-.0008*h }; } },
  surfer: { pivot:[.42,.82], aura:[6,.05], f:(t,m,e)=>({ ox:Math.sin(t*.65)*18*m, oy:(Math.cos(t*1.3)*11 - 60*Math.sin(Math.PI*e))*m, rot:Math.sin(t*1.3)*.05*m + spin(e), s:1+.08*Math.sin(Math.PI*e),
              warp:[1.5*m,0,1,t*2] }) },
};
for (const id in letterIdx) { const i = letterIdx[id];
  CHOREO[id] = { pivot:[.5,.6], aura:[3,.07], f:(t,m,e)=>{ const p=t*2.4 - i*.55;
    return { oy:(Math.sin(p)*11 - 34*Math.sin(Math.PI*e))*m, rot:Math.sin(p+1)*.045*m + spin(e), s:1+.045*Math.sin(p+2)*m + .15*Math.sin(Math.PI*e) }; } };
}
[0,1,2].forEach(k => CHOREO["bird"+k] = { pivot:[.5,.5], aura:[2,.18], f:(t,m,e)=>{ const w=.5+.13*k, r=30+14*k, ph=k*2.1;
  return { ox:(Math.cos(t*w+ph)*r + 160*e*Math.cos(ph))*m, oy:(Math.sin(t*w*1.4+ph)*r*.45 - 90*e)*m, sy:1-(.5+.5*Math.sin(t*9+ph))*.55*m, rot:Math.sin(t*w+ph)*.15*m }; } });

const LABELS = [["Plane",.45,.07],["Prop",.57,.095],["Gulls",.76,.085],["Sun",.26,.13],["Cloud",.86,.03],["Lighthouse",.652,.17],["House",.855,.2],
  ["Letters ×10",.46,.3],["Gull",.19,.44],["Lobster",.24,.7],["Fizz",.345,.6],["Cooler",.17,.9],["Surfer",.74,.68],["Water",.6,.94]];

/* ---------- GL setup ---------- */
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2", { antialias:false, alpha:false, powerPreference:"high-performance" });
const stage = document.getElementById("stage"), loadEl = document.getElementById("load");
if (!gl) { loadEl.textContent = "This browser has no WebGL2"; throw new Error("no webgl2"); }

const COMMON = `#version 300 es
precision highp float;
uniform float uTime, uTrip, uSeg;
vec3 pal(float t){ return .5+.5*cos(6.28318*(t+vec3(0.,.33,.67))); }
vec3 hueRot(vec3 c, float a){ const vec3 k=vec3(.57735); float ca=cos(a), sa=sin(a); return c*ca+cross(k,c)*sa+k*dot(k,c)*(1.-ca); }
float luma(vec3 c){ return dot(c,vec3(.299,.587,.114)); }
float plasma(vec2 p, float t){ p*=3.;
  for(int i=1;i<4;i++){ float f=float(i); p+=vec2(.7/f*sin(f*p.y+t*.6+.3*f), .7/f*cos(f*p.x+t*.5+.7*f)); }
  return .5+.5*sin(p.x+p.y); }
// x = ink, y = bare paper, z = crayon
vec3 classify(vec3 c){ float l=luma(c); float mx=max(c.r,max(c.g,c.b)), mn=min(c.r,min(c.g,c.b)); float sat=(mx-mn)/(mx+1e-4);
  float ink=smoothstep(.42,.16,l); float paper=smoothstep(.6,.8,l)*smoothstep(.24,.1,sat)*(1.-ink);
  return vec3(ink,paper,clamp(1.-ink-paper,0.,1.)); }
vec3 trippy(vec3 c, vec2 uv, float ph){
  vec3 k=classify(c);
  float f=plasma(uv*vec2(1.,1.333)+ph*3., uTime);
  vec3 cc=hueRot(c, uTrip*(uTime*.45+f*3.2+ph*6.28));
  cc=mix(vec3(luma(cc)),cc,1.+.7*uTrip);
  vec3 pp=mix(c, c*(.5+.62*pal(f*1.4+uTime*.07+ph)), uTrip*.85);
  vec3 ii=c+uTrip*.07*pal(f+uTime*.1+ph+.5);
  return clamp(ii*k.x+pp*k.y+cc*k.z,0.,1.);
}`;

const VS_FULL = `#version 300 es
in vec2 aPos; out vec2 vUV; out vec2 vP;
void main(){ vP=aPos*.5+.5; vUV=vec2(vP.x,1.-vP.y); gl_Position=vec4(aPos,0.,1.); }`;

const FS_BG = COMMON + `
uniform sampler2D uBg,uRA,uRB; uniform float uMot; uniform vec3 uRip[4];
in vec2 vUV; out vec4 o;
float hash(float n){ return fract(sin(n*127.1)*43758.5453); }
void main(){
  vec2 asp=vec2(1.,1.3333), uv=vUV;
  float water=texture(uRA,uv).r;
  uv+=uMot*water*.0034*vec2(sin(uv.y*55.+uTime*2.2)+.5*sin(uv.y*23.-uTime*1.3), cos(uv.x*41.+uTime*1.9));
  uv+=uMot*uTrip*.0045*vec2(sin(uv.y*9.+uTime*.7), cos(uv.x*8.+uTime*.6));
  for(int i=0;i<4;i++){ vec2 d=(uv-uRip[i].xy)*asp; float r=length(d), w=uTime-uRip[i].z;
    float ring=sin((r-w*.45)*46.)*exp(-abs(r-w*.45)*9.)*exp(-w*1.6)*step(0.,w);
    uv+=normalize(d+1e-5)*ring*.014; }
  vec3 c=texture(uBg,uv).rgb, ra=texture(uRA,uv).rgb, rb=texture(uRB,uv).rgb;
  vec3 k=classify(c); vec3 col=trippy(c,uv,0.);
  // sun: radiating rings
  float sd=length((uv-vec2(.26,.132))*asp);
  vec3 rings=pal(sd*4.-uTime*.35)*(.78+.22*sin(sd*150.-uTime*5.));
  col=mix(col, mix(col,rings,k.y), ra.g*uTrip);
  // cloud: slow lava
  float f2=plasma(uv*asp*2.2+3., uTime*1.3);
  col=mix(col, mix(col, pal(f2*1.3+uTime*.09+.3)*.85+.15, k.y), ra.b*uTrip*.9);
  // buildings shimmer
  col=mix(col, hueRot(col,uTime*1.4+uv.x*30.), (rb.r+rb.g)*uTrip*.6*k.z);
  // lighthouse beams
  vec2 d=(uv-vec2(.6535,.0505))*asp; float a=atan(d.y,d.x), r=length(d);
  float beam=pow(max(0.,cos(a-uTime*.6)),70.)+pow(max(0.,cos(a-uTime*.6+3.14159)),70.);
  beam*=smoothstep(.015,.05,r)*smoothstep(1.2,.05,r);
  col+=beam*uTrip*.6*pal(r*2.-uTime*.25);
  // bubbles drifting up through the surf
  for(int i=0;i<10;i++){ float fi=float(i); float ph=fract(hash(fi+7.)+uTime*(.03+.025*hash(fi)));
    vec2 bc=vec2(.42+.56*hash(fi+3.)+.015*sin(uTime*1.3+fi), mix(.97,.5,ph)); float rad=.009+.012*hash(fi+11.);
    float dd=length((vUV-bc)*asp);
    float ringm=smoothstep(rad,rad-.0018,dd), inner=smoothstep(rad-.004,rad-.0058,dd);
    float hl=smoothstep(.0035,.002,length((vUV-bc)*asp-vec2(-.35,-.35)*rad));
    vec3 fill=mix(vec3(.96,.87,.85), pal(fi*.17+uTime*.2), .55*uTrip);
    col=mix(col, mix(vec3(.04,.02,.07), mix(fill,vec3(1.),hl), inner), ringm*texture(uRA,bc).r*sin(ph*3.14159)*uMot); }
  // "parts" view
  vec3 sg=vec3(luma(c))*.28;
  sg=mix(sg,vec3(.16,.42,.95)*(.4+luma(c)*.8), ra.r*.8);
  sg=mix(sg,vec3(1.,.82,.2)*(.3+luma(c)*.7), ra.g);
  sg=mix(sg,vec3(.72,.55,1.)*(.3+luma(c)*.7), ra.b);
  sg=mix(sg,vec3(.25,.95,.75)*(.3+luma(c)*.7), rb.r);
  sg=mix(sg,vec3(1.,.5,.3)*(.3+luma(c)*.7), rb.g);
  o=vec4(mix(col,sg,uSeg),1.);
}`;

const VS_SPR = `#version 300 es
in vec2 aUV;
uniform vec4 uRect, uWarp; uniform vec3 uFlap; uniform mat3 uM; uniform float uGrow;
out vec2 vUV; out vec2 vW;
void main(){
  vec2 p=uRect.xy+aUV*uRect.zw;
  p.x+=uWarp.x*sin(uWarp.z*aUV.y*6.28318+uWarp.w);
  p.y+=uWarp.y*sin(uWarp.z*aUV.x*6.28318+uWarp.w*1.3);
  p.y-=uFlap.x*uRect.w*pow(abs(aUV.x-uFlap.y)*2.,1.4);
  vec2 c=uRect.xy+uRect.zw*.5; p=c+(p-c)*uGrow;
  vec3 w=uM*vec3(p,1.);
  vW=w.xy/vec2(${W}.,${H}.); vUV=aUV;
  gl_Position=vec4(vW.x*2.-1., 1.-vW.y*2., 0., 1.);
}`;

const FS_SPR = COMMON + `
uniform sampler2D uTex; uniform int uMode; uniform vec4 uColor; uniform float uPh;
in vec2 vUV; in vec2 vW; out vec4 o;
void main(){
  vec4 t=texture(uTex,vUV);
  if(uMode==1){ float a=smoothstep(.35,.65,t.a)*uColor.a; o=vec4(uColor.rgb*a,a); return; }
  vec3 c=trippy(t.rgb,vW,uPh);
  vec3 sg=uColor.rgb*(.25+.85*luma(t.rgb));
  c=mix(c,sg,uSeg);
  o=vec4(c*t.a,t.a);
}`;

const FS_POST = `#version 300 es
precision highp float;
uniform sampler2D uScene,uPrev; uniform float uTime,uTrip,uKal,uMelt;
in vec2 vP; out vec4 o;
vec3 hueRot(vec3 c, float a){ const vec3 k=vec3(.57735); float ca=cos(a), sa=sin(a); return c*ca+cross(k,c)*sa+k*dot(k,c)*(1.-ca); }
void main(){
  vec2 uv=vP;
  if(uKal>.001){
    vec2 p=(vP-.5)*vec2(.75,1.); float r=length(p), a=atan(p.y,p.x)+uTime*.06;
    float seg=6.28318/8.; a=abs(mod(a,seg)-seg*.5)+uTime*.11;
    vec2 q=vec2(.5,.5)+r*1.25*vec2(cos(a),sin(a))/vec2(.75,1.)+.12*vec2(sin(uTime*.13),cos(uTime*.17));
    q=1.-abs(mod(q,2.)-1.);
    uv=mix(vP,q,uKal);
  }
  vec2 d=uv-.5; float ab=uTrip*.007*(.55+.45*sin(uTime*.8));
  vec3 c=vec3(texture(uScene,uv+d*ab).r, texture(uScene,uv).g, texture(uScene,uv-d*ab).b);
  float ca=cos(.006), sa=sin(.006); vec2 f=vP-.5; f=mat2(ca,-sa,sa,ca)*f*.984+.5;
  vec3 fb=hueRot(texture(uPrev,f).rgb,.14)*.955;
  float ink=smoothstep(.36,.1,dot(c,vec3(.299,.587,.114)));
  c=mix(c,max(c,fb),uMelt*(1.-.92*ink));
  o=vec4(c,1.);
}`;
const FS_COPY = `#version 300 es
precision highp float; uniform sampler2D uTex; in vec2 vP; out vec4 o; void main(){ o=texture(uTex,vP); }`;

function prog(vs, fs, attr) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.bindAttribLocation(p, 0, attr);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); const name = info.name.replace("[0]", ""); u[name] = gl.getUniformLocation(p, name); }
  return { p, u };
}
const P_BG = prog(VS_FULL, FS_BG, "aPos"), P_SPR = prog(VS_SPR, FS_SPR, "aUV"), P_POST = prog(VS_FULL, FS_POST, "aPos"), P_COPY = prog(VS_FULL, FS_COPY, "aPos");

// geometry
const vaoFull = gl.createVertexArray(); gl.bindVertexArray(vaoFull);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const N = 14, verts = [], idx = [];
for (let y = 0; y <= N; y++) for (let x = 0; x <= N; x++) verts.push(x / N, y / N);
for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const a = y * (N + 1) + x; idx.push(a, a + 1, a + N + 1, a + 1, a + N + 2, a + N + 1); }
const vaoGrid = gl.createVertexArray(); gl.bindVertexArray(vaoGrid);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
gl.bindVertexArray(null);

function loadTex(url) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, im);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      res(t); };
    im.onerror = () => rej(new Error("could not load " + url));
    im.src = url;
  });
}

// framebuffers
let fbos = [], cw = 0, ch = 0;
function makeFBO(w, h) { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  return { f, t }; }
function resize() {
  const bar = document.getElementById("bar").offsetHeight;
  const availW = window.innerWidth, availH = window.innerHeight - bar - 4;
  const cssW = Math.floor(Math.min(availW, availH * W / H)), cssH = Math.floor(cssW * H / W);
  stage.style.width = cssW + "px"; stage.style.height = cssH + "px";
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const w = Math.min(1200, Math.round(cssW * dpr)), h = Math.round(w * H / W);
  if (w === cw && h === ch) return;
  cw = canvas.width = w; ch = canvas.height = h;
  fbos.forEach(o => { gl.deleteFramebuffer(o.f); gl.deleteTexture(o.t); });
  fbos = [makeFBO(w, h), makeFBO(w, h), makeFBO(w, h)];
}
window.addEventListener("resize", resize);

/* ---------- state ---------- */
const state = { trip:.7, seg:0, segT:0, kal:0, kalT:0, rips:[[0,0,-99],[0,0,-99],[0,0,-99],[0,0,-99]], ripI:0 };
const sprites = SPR.map((s, i) => ({ ...s, i, e:0, ch:CHOREO[s.id], M:[1,0,0,1,0,0], cur:{}, ph:(i * .137) % 1 }));
const byId = Object.fromEntries(sprites.map(s => [s.id, s]));
const mul = (a, b) => [a[0]*b[0]+a[2]*b[1], a[1]*b[0]+a[3]*b[1], a[0]*b[2]+a[2]*b[3], a[1]*b[2]+a[3]*b[3], a[0]*b[4]+a[2]*b[5]+a[4], a[1]*b[4]+a[3]*b[5]+a[5]];

function pose(s, t, m, seg) {
  const c = s.ch.f(t, m, s.e); s.cur = c;
  const sx = (c.sx ?? 1) * (c.s ?? 1), sy = (c.sy ?? 1) * (c.s ?? 1), r = c.rot || 0;
  const pvx = s.x + s.ch.pivot[0] * s.w, pvy = s.y + s.ch.pivot[1] * s.h;
  // exploded view pushes parts away from the middle of the sheet
  const ex = s.ch.parent ? 0 : seg * .1 * (s.x + s.w / 2 - W / 2), ey = s.ch.parent ? 0 : seg * .1 * (s.y + s.h / 2 - H * .52);
  const a = Math.cos(r) * sx, b = Math.sin(r) * sx, cc = -Math.sin(r) * sy, d = Math.cos(r) * sy;
  let M = [a, b, cc, d, (c.ox || 0) + ex + pvx - (a * pvx + cc * pvy), (c.oy || 0) + ey + pvy - (b * pvx + d * pvy)];
  if (s.ch.parent) M = mul(byId[s.ch.parent].M, M);
  s.M = M;
}

/* ---------- render ---------- */
let TEX = null;
function drawSprite(s, mode, grow, color) {
  const u = P_SPR.u, M = s.M, c = s.cur;
  gl.uniform4f(u.uRect, s.x, s.y, s.w, s.h);
  gl.uniformMatrix3fv(u.uM, false, [M[0], M[1], 0, M[2], M[3], 0, M[4], M[5], 1]);
  const wp = c.warp || [0, 0, 0, 0], fl = c.flap || [0, .5];
  gl.uniform4f(u.uWarp, wp[0], wp[1], wp[2], wp[3]); gl.uniform3f(u.uFlap, fl[0], fl[1], 0);
  gl.uniform1f(u.uGrow, grow); gl.uniform1i(u.uMode, mode); gl.uniform4fv(u.uColor, color); gl.uniform1f(u.uPh, s.ph);
  gl.bindTexture(gl.TEXTURE_2D, TEX[s.id]);
  gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_SHORT, 0);
}
const palJS = t => [0, .33, .67].map(o => .5 + .5 * Math.cos(6.28318 * (t + o)));
const sm = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a) / (b - a))); return k * k * (3 - 2 * k); };

let last = 0, T = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000 || 0); last = now; T += dt;
  state.segT += (state.seg - state.segT) * Math.min(1, dt * 6);
  state.kalT += (state.kal - state.kalT) * Math.min(1, dt * 4);
  const trip = state.trip * (1 - state.segT), m = sm(0, .12, state.trip), aur = sm(.12, .6, state.trip) * (1 - state.segT), melt = sm(.72, 1, state.trip) * .6 * (1 - state.segT);
  for (const s of sprites) { s.e = Math.max(0, s.e - dt / 1.3); pose(s, T, m, state.segT); }

  // scene → fbo 0
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[0].f); gl.viewport(0, 0, cw, ch); gl.disable(gl.BLEND);
  gl.useProgram(P_BG.p); gl.bindVertexArray(vaoFull);
  gl.uniform1f(P_BG.u.uTime, T); gl.uniform1f(P_BG.u.uTrip, trip); gl.uniform1f(P_BG.u.uSeg, state.segT); gl.uniform1f(P_BG.u.uMot, m);
  gl.uniform3fv(P_BG.u.uRip, state.rips.flat());
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, TEX.regB); gl.uniform1i(P_BG.u.uRB, 2);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, TEX.regA); gl.uniform1i(P_BG.u.uRA, 1);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, TEX.bg); gl.uniform1i(P_BG.u.uBg, 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(P_SPR.p); gl.bindVertexArray(vaoGrid);
  gl.uniform1f(P_SPR.u.uTime, T); gl.uniform1f(P_SPR.u.uTrip, trip); gl.uniform1f(P_SPR.u.uSeg, state.segT); gl.uniform1i(P_SPR.u.uTex, 0);
  // auras: nested rainbow echoes flowing outward from every part
  if (aur > .01) {
    const flow = T * .45, fr = flow % 1, step = Math.floor(flow);
    for (const s of sprites) { const [K, g] = s.ch.aura; const boost = 1 + 1.2 * s.e;
      for (let k = K - 1; k >= 0; k--) { const q = (k + fr) / K;
        const col = palJS((k - step) * .13 + s.i * .071 + T * .03);
        drawSprite(s, 1, 1 + g * (k + fr) * aur * boost, [col[0], col[1], col[2], (1 - q) * aur * .92]); } }
  }
  for (const s of sprites) { const col = palJS(s.i * .618); drawSprite(s, 0, 1, [col[0], col[1], col[2], 1]); }
  gl.disable(gl.BLEND);

  // post → fbo A (also next frame's feedback), then to screen
  const A = fbos[1], B = fbos[2];
  gl.bindFramebuffer(gl.FRAMEBUFFER, A.f); gl.useProgram(P_POST.p); gl.bindVertexArray(vaoFull);
  gl.uniform1f(P_POST.u.uTime, T); gl.uniform1f(P_POST.u.uTrip, trip); gl.uniform1f(P_POST.u.uKal, state.kalT); gl.uniform1f(P_POST.u.uMelt, melt);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, B.t); gl.uniform1i(P_POST.u.uPrev, 1);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fbos[0].t); gl.uniform1i(P_POST.u.uScene, 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, cw, ch);
  gl.useProgram(P_COPY.p); gl.bindTexture(gl.TEXTURE_2D, A.t); gl.uniform1i(P_COPY.u.uTex, 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  fbos[1] = B; fbos[2] = A;
  requestAnimationFrame(frame);
}

/* ---------- interaction ---------- */
function kickAt(px, py) {
  state.rips[state.ripI = (state.ripI + 1) % 4] = [px / W, py / H, T];
  for (let i = sprites.length - 1; i >= 0; i--) { const s = sprites[i]; if (s.id === "prop") continue;
    const [a, b, c, d, tx, ty] = s.M, det = a * d - b * c || 1;
    const x = (d * (px - tx) - c * (py - ty)) / det, y = (a * (py - ty) - b * (px - tx)) / det;
    const pad = s.w < 140 ? 26 : 0;
    if (x > s.x - pad && x < s.x + s.w + pad && y > s.y - pad && y < s.y + s.h + pad) {
      if (s.id.startsWith("bird")) ["bird0","bird1","bird2"].forEach(b => byId[b].e = 1);
      else if (s.id.startsWith("L_")) { const j = letterIdx[s.id]; for (const id in letterIdx) setTimeout(() => byId[id].e = 1, Math.abs(letterIdx[id] - j) * 70); }
      else s.e = 1;
      pluck(1 - py / H); return; } }
  pluck(1 - py / H);
}
canvas.addEventListener("pointerdown", ev => {
  const r = canvas.getBoundingClientRect();
  kickAt((ev.clientX - r.left) / r.width * W, (ev.clientY - r.top) / r.height * H);
  document.getElementById("hint").style.opacity = 0;
});
const tripEl = document.getElementById("trip");
tripEl.addEventListener("input", () => state.trip = tripEl.value / 100);
function toggle(id, fn) { const b = document.getElementById(id); b.addEventListener("click", () => { const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); fn(on); }); }
const labelsEl = document.getElementById("labels");
LABELS.forEach(([n, x, y]) => { const s = document.createElement("span"); s.textContent = n; s.style.left = (x * 100) + "%"; s.style.top = (y * 100) + "%"; labelsEl.appendChild(s); });
toggle("bSeg", on => { state.seg = on ? 1 : 0; labelsEl.classList.toggle("on", on); });
toggle("bKal", on => state.kal = on ? 1 : 0);

/* ---------- sound: surf wash, a slow drone, and plucks on taps ---------- */
let AC = null, master = null, delay = null, soundOn = false;
function startSound() {
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
  master.gain.linearRampToValueAtTime(.8, AC.currentTime + 2);
  delay = AC.createDelay(1); delay.delayTime.value = .38; const fb = AC.createGain(); fb.gain.value = .45;
  delay.connect(fb); fb.connect(delay); delay.connect(master);
  // drone: detuned saws through a breathing filter
  const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 500; lp.Q.value = 6;
  const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = .07; lg.gain.value = 320; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  const dg = AC.createGain(); dg.gain.value = .07; lp.connect(dg); dg.connect(master); dg.connect(delay);
  [55, 82.5, 110.4, 164.6, 247.2].forEach((f, i) => { const o = AC.createOscillator(); o.type = i % 2 ? "sawtooth" : "triangle"; o.frequency.value = f; o.detune.value = (i - 2) * 6; o.connect(lp); o.start(); });
  // surf: filtered noise swelling like waves
  const buf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const ns = AC.createBufferSource(); ns.buffer = buf; ns.loop = true;
  const bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 700; bp.Q.value = .6;
  const ng = AC.createGain(); ng.gain.value = .05; const sw = AC.createOscillator(), sg = AC.createGain(); sw.frequency.value = .11; sg.gain.value = .045; sw.connect(sg); sg.connect(ng.gain); sw.start();
  const sf = AC.createOscillator(), sfg = AC.createGain(); sf.frequency.value = .11; sfg.gain.value = 450; sf.connect(sfg); sfg.connect(bp.frequency); sf.start();
  ns.connect(bp); bp.connect(ng); ng.connect(master); ns.start();
}
const SCALE = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22, 24];
function pluck(h) {
  if (!AC || !soundOn) return;
  const t = AC.currentTime, f = 220 * Math.pow(2, SCALE[Math.min(SCALE.length - 1, Math.floor(h * SCALE.length))] / 12);
  const o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain();
  o.type = "triangle"; o2.type = "sine"; o.frequency.value = f; o2.frequency.value = f * 2.005;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.22, t + .008); g.gain.exponentialRampToValueAtTime(.0008, t + 1.4);
  o.connect(g); o2.connect(g); g.connect(master); g.connect(delay); o.start(t); o2.start(t); o.stop(t + 1.5); o2.stop(t + 1.5);
}
toggle("bSnd", on => { soundOn = on; if (on && !AC) startSound(); else if (AC) { AC.resume(); master.gain.cancelScheduledValues(AC.currentTime); master.gain.setTargetAtTime(on ? .8 : 0, AC.currentTime, .2); } });

/* ---------- go ---------- */
(async () => {
  try {
    const names = ["bg.jpg", "regA.png", "regB.png", ...SPR.map(s => s.id + ".webp")];
    const texs = await Promise.all(names.map(n => loadTex("assets/" + n)));
    TEX = { bg:texs[0], regA:texs[1], regB:texs[2] }; SPR.forEach((s, i) => TEX[s.id] = texs[3 + i]);
    resize(); loadEl.remove();
    setTimeout(() => document.getElementById("hint").style.opacity = 0, 6000);
    requestAnimationFrame(frame);
  } catch (err) { loadEl.textContent = "Couldn't load: " + err.message; }
})();
</script>
